    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Source Sans 3', 'Source Sans Pro', Arial, sans-serif;
        }

        canvas#canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 2016 Roblox Loading Overlay */
        #loading {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #262626;
            z-index: 9999;
            overflow: hidden;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><polygon points='2,2 2,19 7,15 11,22 13.5,20.8 9.5,13.8 16,13.8' fill='%231e1e1e' stroke='%23d8d8d8' stroke-width='1.3' stroke-linejoin='miter'/></svg>") 2 2, default;
        }

        #bg-mosaic {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        /* Top-Right Close 'X' */
        #close-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 34px;
            height: 34px;
            background: transparent;
            border: none;
            color: #e6e6e6;
            cursor: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.88;
            transition: opacity 0.15s ease, transform 0.1s ease;
            z-index: 10;
        }

        #close-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        /* Bottom-Left Place & Creator Info */
        #place-info {
            position: absolute;
            left: 52px;
            bottom: 42px;
            z-index: 10;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
        }

        #place-title {
            color: #f2f2f2;
            font-size: clamp(22px, 2.2vw, 32px);
            font-weight: 400;
            letter-spacing: 0.2px;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        #place-creator {
            color: #cccccc;
            font-size: clamp(14px, 1.25vw, 19px);
            font-weight: 400;
            letter-spacing: 0.15px;
            line-height: 1.2;
        }

        /* Bottom-Right Cyan Spinner & Loading Text */
        #spinner-container {
            position: absolute;
            right: 54px;
            bottom: 38px;
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #spinner-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            animation: rbx-spin 1.15s linear infinite;
        }

        @keyframes rbx-spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading-text {
            position: relative;
            z-index: 2;
            color: #d4d4d4;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.2px;
            text-align: center;
            pointer-events: none;
        }
    </style>

            </svg>
            <span id="loading-text">Loading...</span>

    <canvas id="canvas" oncontextmenu="return false"></canvas>

    <!-- 2016 Low-Poly Triangle Mosaic Renderer -->
    <script>(function () {
      var bgCanvas = document.getElementById('bg-mosaic');
      if (!bgCanvas) return;
      var ctx = bgCanvas.getContext('2d');

      function drawMosaic() {
        var w = bgCanvas.width = window.innerWidth;
        var h = bgCanvas.height = window.innerHeight;
        var size = 46;
        var cols = Math.ceil(w / size) + 2;
        var rows = Math.ceil(h / size) + 2;
        var shades = ['#222222', '#252525', '#272727', '#2a2a2a', '#2c2c2c', '#2f2f2f', '#323232'];

        // Deterministic pseudo-random shade selector matching 2016 Roblox client tiling
        function shadeAt(c, r, half) {
          var n = Math.sin(c * 127.1 + r * 311.7 + half * 74.7) * 43758.5453;
          var idx = Math.floor((n - Math.floor(n)) * shades.length);
          return shades[idx];
        }

        for (var r = -1; r < rows; r++) {
          for (var c = -1; c < cols; c++) {
            var x = c * size;
            var y = r * size;
            var flip = ((c + r) & 1) === 0;

            ctx.beginPath();
            if (flip) {
              ctx.moveTo(x, y);
              ctx.lineTo(x + size, y);
              ctx.lineTo(x, y + size);
            } else {
              ctx.moveTo(x, y);
              ctx.lineTo(x + size, y);
              ctx.lineTo(x + size, y + size);
            }
            ctx.closePath();
            ctx.fillStyle = shadeAt(c, r, 0);
            ctx.fill();

            ctx.beginPath();
            if (flip) {
              ctx.moveTo(x + size, y);
              ctx.lineTo(x + size, y + size);
              ctx.lineTo(x, y + size);
            } else {
              ctx.moveTo(x, y);
              ctx.lineTo(x + size, y + size);
              ctx.lineTo(x, y + size);
            }
            ctx.closePath();
            ctx.fillStyle = shadeAt(c, r, 1);
            ctx.fill();
          }
        }
      }

      drawMosaic();
      window.addEventListener('resize', drawMosaic);
    })();</script>

    <!-- Original Critical Runtime & Asset Loader -->
    <script>(function () {
    var loadingDiv  = document.getElementById('loading');
    var loadingText = document.getElementById('loading-text');

    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    console.log  = function () {};
    console.warn = function () {};
    console.info = function () {};
    console.debug = function () {};

    var CHUNK_COUNT = 12;
    var loaded = 0;

    var chunksPromise = Promise.all(
      Array.from({ length: CHUNK_COUNT }, function (_, i) {
        return fetch('rblx.data.' + i).then(function (r) {
          if (!r.ok) throw new Error('chunk ' + i + ' failed');
          return r.arrayBuffer().then(function (b) {
            loaded++;
            loadingText.textContent = 'Loading ' + Math.round(loaded / CHUNK_COUNT * 100) + '%';
            return b;
          });
        });
      })
    ).then(function (chunks) {
      var total = chunks.reduce(function (s, c) { return s + c.byteLength; }, 0);
      var out   = new Uint8Array(total);
      var off   = 0;
      chunks.forEach(function (c) { out.set(new Uint8Array(c), off); off += c.byteLength; });
      return URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
    });

    var _origFetch = window.fetch.bind(window);
    window.fetch = function (resource, init) {
      var url = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
      if (/rblx\.data$/.test(url)) {
        return chunksPromise.then(function (blobUrl) { return _origFetch(blobUrl, init); });
      }
      return _origFetch(resource, init);
    };

    window.Module = {
      canvas: document.getElementById('canvas'),
      print:    function () {},
      printErr: function (t) { if (/error|exception/i.test(t)) console.error('[rblx]', t); },
      setStatus: function (t) {
        if (!t) { loadingDiv.style.display = 'none'; return; }
        var m = t.match(/\((\d+)\/(\d+)\)/);
        if (m) {
          var pct = Math.round(parseInt(m[1], 10) / parseInt(m[2], 10) * 100);
          loadingText.textContent = 'Loading ' + pct + '%';
        }
      },
      onRuntimeInitialized: function () { loadingDiv.style.display = 'none'; }
    };

    var s = document.createElement('script');
    s.src = 'rblx.js';
    document.body.appendChild(s);
  })();</script>
  <!-- WebBlox & Uranium Profile Loader with Guest Handling -->
    <script>(function () {
    var loadingDiv  = document.getElementById('loading');
    var loadingText = document.getElementById('loading-text');

    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    console.log  = function () {};
    console.warn = function () {};
    console.info = function () {};
    console.debug = function () {};

    var CHUNK_COUNT = 12;
    var loaded = 0;

    var chunksPromise = Promise.all(
      Array.from({ length: CHUNK_COUNT }, function (_, i) {
        return fetch('rblx.data.' + i).then(function (r) {
          if (!r.ok) throw new Error('chunk ' + i + ' failed');
          return r.arrayBuffer().then(function (b) {
            loaded++;
            loadingText.textContent = 'Loading ' + Math.round(loaded / CHUNK_COUNT * 100) + '%';
            return b;
          });
        });
      })
    ).then(function (chunks) {
      var total = chunks.reduce(function (s, c) { return s + c.byteLength; }, 0);
      var out   = new Uint8Array(total);
      var off   = 0;
      chunks.forEach(function (c) { out.set(new Uint8Array(c), off); off += c.byteLength; });
      return URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
    });

    var _origFetch = window.fetch.bind(window);
    window.fetch = function (resource, init) {
      var url = (typeof resource === 'string') ? resource : (resource && resource.url) || '';
      if (/rblx\.data$/.test(url)) {
        return chunksPromise.then(function (blobUrl) { return _origFetch(blobUrl, init); });
      }
      return _origFetch(resource, init);
    };

    // 1. Fetch user data from your Uranium API
    fetch('https://uranium235.vercel.app/api/me')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var username = 'Guest';

        // Check if the API returned a valid user or a not logged-in error
        if (data && data.user && data.user.username) {
          username = data.user.username;
        } else if (data && data.error) {
          console.warn('Uranium Auth:', data.error);
          // Optional: If you want to force them to log in instead of playing as guest, 
          // you can redirect them here: window.location.href = 'https://uranium235.vercel.app/login';
        }
        
        // Update loading UI status text
        var titleElem = document.getElementById('place-creator');
        if (titleElem) {
          titleElem.textContent = username === 'Guest' ? 'Playing as Guest' : 'Playing as ' + username;
        }

        // 2. Setup window.Module with the username argument
        window.Module = {
          canvas: document.getElementById('canvas'),
          arguments: ['-username', username],
          print:    function () {},
          printErr: function (t) { if (/error|exception/i.test(t)) console.error('[rblx]', t); },
          setStatus: function (t) {
            if (!t) { loadingDiv.style.display = 'none'; return; }
            var m = t.match(/\((\d+)\/(\d+)\)/);
            if (m) {
              var pct = Math.round(parseInt(m[1], 10) / parseInt(m[2], 10) * 100);
              loadingText.textContent = 'Loading ' + pct + '%';
            }
          },
          onRuntimeInitialized: function () { loadingDiv.style.display = 'none'; }
        };

        // 3. Inject the WebBlox engine script
        var s = document.createElement('script');
        s.src = 'rblx.js';
        document.body.appendChild(s);
      })
      .catch(function(err) {
        console.error('Failed to connect to Uranium API:', err);
        // Fallback guest initialization if the API is offline
        window.Module = {
          canvas: document.getElementById('canvas'),
          arguments: ['-username', 'Guest'],
          print: function() {},
          printErr: function() {},
          setStatus: function(t) { if (!t) { loadingDiv.style.display = 'none'; } },
          onRuntimeInitialized: function() { loadingDiv.style.display = 'none'; }
        };
        var s = document.createElement('script');
        s.src = 'rblx.js';
        document.body.appendChild(s);
      });
  })();</script>
